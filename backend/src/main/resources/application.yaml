spring:
  application:
    name: RealtimeAuctionSystem
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/realtime_auction_system}?rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:5404}
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-init-sql: "SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci"
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  cache:
    type: redis
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/callback}
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.1

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:admin.auctionpro@gmail.com}
    password: ${MAIL_PASSWORD:vphtjquwbavbvaqg}
    display-name: AuctionPro
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 10000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: 1
      retries: 1
      batch-size: 65536
      compression-type: snappy
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        request.timeout.ms: 1000
        delivery.timeout.ms: 2500
        retry.backoff.ms: 200
        linger.ms: 10
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 30000
        spring.json.trusted.packages: "*"

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 500
      min-spare: 100
    accept-count: 500
    connection-timeout: 20000

jwt:
  access-key: ${JWT_ACCESS_KEY}
  refresh-key: ${JWT_REFRESH_KEY}
  valid-duration: 300           # 5 minutes
  refreshable-duration: 604800  # 7 days

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket: ${R2_BUCKET:auction-uploads}
  public-url: ${R2_PUBLIC_URL}

app:
  cors:
    allowed-origin-patterns: http://localhost:5173,http://localhost:4173,https://auctionpro-psi.vercel.app,https://www.auctionpro.online
  file:
    upload-dir: ${FILE_UPLOAD_DIR:F:\bidding-platform\upload}
    max-size: 5242880 # 5MB
    allowed-types: image/jpeg,image/png,image/webp,image/gif
  fpt:
    api-key: ${FPT_API_KEY}
    id-recognition-url: https://api.fpt.ai/vision/idr/vnm/
    face-match-url: https://api.fpt.ai/dmp/checkface/v1/