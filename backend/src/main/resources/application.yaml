spring:
  application:
    name: RealtimeAuctionSystem
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        enable_lazy_load_no_trans: true
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  redis:
    host: localhost
    port: 6379
    password:
    timeout: 3000
    lettuce:
      pool:
        max-active: 50
        max-idle: 10
        min-idle: 5
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: 1
      retries: 3
      batch-size: 16384
      linger-ms: 10
      compression-type: snappy
    consumer:
      group-id: auction-db-sync-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100

server:
  port: 8080
  servlet:
    context-path: /api/v1

outbound:
  redirect-uri: http://localhost:5173/auth/callback
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}

jwt:
  signer-key: ${JWT_SIGNER_KEY}
  valid-duration: 2 # in hours
  refreshable-duration: 48 # in hours